<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Konfigurasi PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  
  <title>SANTET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020617;
    }
    iframe {
      width: 100%; height: 100%; border: none;
    }
  </style>
</head>
<body>

  <!-- Iframe memuat Google Apps Script -->
  <iframe src="https://script.google.com/macros/s/AKfycbyAOKVVRuqY9AHd23X8I5rqE600-CWH-sXLBdGgD3d-IAd102ZnJXdX21NXWt6e7Zxz/exec" allow="geolocation; microphone; camera"></iframe>

  <!-- POP-UP / BANNER INSTALL CUSTOM (Disembunyikan awalnya) -->
  <div id="installPopup" class="hidden fixed bottom-4 left-4 right-4 bg-slate-900 border border-slate-700 p-4 rounded-2xl shadow-2xl z-50 flex items-center justify-between gap-3 animate-bounce-short">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center font-bold text-slate-950 text-lg">ðŸ“±</div>
      <div>
        <h4 class="font-bold text-sm text-slate-100">Install Aplikasi</h4>
        <p class="text-xs text-slate-400">Pasang aplikasi ini di layar utama HP Anda.</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="tutupPopup()" class="px-3 py-2 text-xs text-slate-400 hover:text-white">Nanti</button>
      <button id="btnInstall" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-xl text-xs shadow-lg">Install</button>
    </div>
  </div>

  <script>
    let deferredPrompt;
    const popup = document.getElementById('installPopup');
    const btnInstall = document.getElementById('btnInstall');

    // Menangkap event install dari browser
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); // Cegah banner bawaan browser yang kaku
      deferredPrompt = e;  // Simpan event untuk dipicu nanti
      
      // Munculkan pop-up custom kita setelah beberapa detik
      setTimeout(() => {
        popup.classList.remove('hidden');
      }, 1500);
    });

    // Ketika tombol Install di pop-up diklik
    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      popup.classList.add('hidden');
      deferredPrompt.prompt(); // Tampilkan dialog install resmi browser
      
      let choiceResult = await deferredPrompt.userChoice;
      if (choiceResult.outcome === 'accepted') {
        console.log('Pengguna menyetujui instalasi PWA');
      }
      deferredPrompt = null;
    });

    function tutupPopup() {
      popup.classList.add('hidden');
    }

    // Registrasi Service Worker agar syarat PWA terpenuhi oleh browser
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker Berhasil Terdaftar'))
          .catch((err) => console.log('Gagal Daftar SW:', err));
      });
    }
  </script>
</body>
</html>
